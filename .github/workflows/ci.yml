name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['log.txt', 'REPORT.md']
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck -x bin/claude-interactive scripts/*.sh tests/run.sh .githooks/pre-commit

  test:
    # Offline tests against a fake Claude Code TUI (tests/fake-claude). macOS
    # runs them with the system bash 3.2, Ubuntu with bash 5.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux and jq
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tmux jq
          else
            brew install tmux jq
          fi
          tmux -V
          jq --version
      - name: Run tests
        run: /bin/bash tests/run.sh
