name: Claude Interactive Cron

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_prompt:
        description: 'Custom prompt (leave empty for default)'
        required: false
        default: ''

permissions:
  contents: write

# Two runs pushing to log.txt at the same time would conflict.
concurrency:
  group: claude-interactive-cron
  cancel-in-progress: false

jobs:
  interactive-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build prompt
        env:
          # Passed through the environment, never interpolated into the script.
          CUSTOM_PROMPT: ${{ github.event.inputs.custom_prompt }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          if [ -n "$CUSTOM_PROMPT" ]; then
            PROMPT="$CUSTOM_PROMPT"
          else
            PROMPT="You are a helpful maintenance bot. Please: 1) Check the current date and system uptime using bash. 2) Read log.txt and count how many entries it has so far. 3) Create a file called REPORT.md containing a brief system health report with the date, uptime, and entry count. 4) Add a new entry to log.txt in the format: Run #${RUN_NUMBER} — ${TIMESTAMP} — followed by a short software engineering observation. Save all files."
          fi
          printf '%s' "$PROMPT" > "$RUNNER_TEMP/claude-prompt.txt"

      - name: Run Claude Code interactively
        id: claude
        uses: ./
        with:
          prompt-files: ${{ runner.temp }}/claude-prompt.txt
          oauth-token: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
          base-config: ${{ secrets.CLAUDE_ONBOARDING_JSON }}
          # Pinned on purpose: dialogs and keybindings change between releases.
          claude-version: '2.1.314'
          timeout: '600'
          artifact-name: claude-session-logs

      - name: Check that log.txt was updated
        run: |
          if git diff --quiet log.txt; then
            echo "::error::Claude finished but log.txt was not modified"
            exit 1
          fi
          tail -n 3 log.txt

      - name: Commit changes
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          git config user.name "claude-interactive-bot"
          git config user.email "bot@example.com"
          git add log.txt
          if [ -f REPORT.md ]; then git add REPORT.md; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "log: entry added by interactive Claude session (run #${RUN_NUMBER})"
            git push
          fi
